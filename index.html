<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kangaroo Coach</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Shared SVG patterns for T-shirts (used by every drawing on the page) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <pattern id="p-striped" width="6" height="6" patternUnits="userSpaceOnUse">
                <rect width="6" height="6" fill="#ffffff"/>
                <rect width="6" height="3" fill="#555"/>
            </pattern>
            <pattern id="p-dotted" width="6" height="6" patternUnits="userSpaceOnUse">
                <rect width="6" height="6" fill="#ffffff"/>
                <circle cx="3" cy="3" r="1.4" fill="#555"/>
            </pattern>
        </defs>
    </svg>

    <div class="container">
        <header>
            <h1>Kangaroo Coach</h1>
            <p class="username">Tricky Math Kangaroo questions, one small step at a time.</p>
        </header>

        <nav class="page-nav">
            <div class="nav-row">
                <a href="#/" class="nav-link" data-nav="home">Home</a>
            </div>
        </nav>

        <div class="layout">
            <aside class="sidebar" id="sidebar"></aside>
            <main id="main"></main>
        </div>
    </div>

    <script src="js/draw.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/registry.js"></script>
    <!-- Lessons: add one script per lesson -->
    <script src="lessons/two-patterns.js"></script>
    <script src="lessons/chains.js"></script>
    <script src="lessons/circle-runners.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
